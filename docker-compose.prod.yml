name: todo-app

services:
  backend:
    image: padwalarya/todo-backend:latest
    container_name: todo-backend
    ports:
      - "5000:5000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-To-Do data}
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/api/status\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    image: padwalarya/todo-frontend:latest
    container_name: todo-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      FLASK_BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
